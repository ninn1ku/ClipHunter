# Security headers for the watch-room pages (/watch, /watch/{roomId}). Same as
# cliphunter-headers.conf except:
#  - CSP allows the official embedded players: YouTube IFrame API, Twitch (player.twitch.tv)
#    and VK Video (vk.ru:
#    videoplayer.js + video_ext.php), plus the rooms WebSocket and same-origin media;
#  - Referrer-Policy sends the origin (never the path with the room id): the YouTube embed
#    refuses to play without a Referer (player error 153), other embeds check the site too.
# __DOMAIN__ is filled by deploy/provision.sh.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://vk.ru https://player.twitch.tv; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://vk.ru https://player.twitch.tv; img-src 'self' https: data:; media-src 'self'; connect-src 'self' wss://__DOMAIN__; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
