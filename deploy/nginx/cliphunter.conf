# ClipHunter — Nginx site. Placeholders (__DOMAIN__, __APP__) are filled by deploy/provision.sh.
# Only public/ is exposed; finished files are served from an internal location via X-Accel-Redirect.

limit_req_zone  $binary_remote_addr zone=ch_api:10m     rate=5r/s;
limit_req_zone  $binary_remote_addr zone=ch_analyze:10m rate=15r/m;
limit_conn_zone $binary_remote_addr zone=ch_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Privacy: web logs keep IPs with the last part zeroed, and never the query string.
map $remote_addr $ch_anon_ip {
    ~^(?P<p>\d+\.\d+\.\d+)\.\d+$          $p.0;
    ~^(?P<p>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):  $p::;
    default                                0.0.0.0;
}
log_format ch_anon '$ch_anon_ip [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time "$http_user_agent" rid=$sent_http_x_request_id';

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    access_log /var/log/nginx/cliphunter.access.log ch_anon;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.22 (Debian 12): http2 is a listen parameter ("http2 on" needs 1.25+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ch_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root __APP__/current/public;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/cliphunter.access.log ch_anon;
    error_log  /var/log/nginx/cliphunter.error.log warn;

    client_max_body_size 16k;
    client_body_timeout 15s;
    limit_conn ch_conn 30;

    include /etc/nginx/snippets/cliphunter-headers.conf;

    error_page 404 /404.html;

    # --- API (PHP-FPM) ---
    location = /api/analyze {
        limit_req zone=ch_analyze burst=5 nodelay;
        include /etc/nginx/snippets/cliphunter-php.conf;
    }

    location ^~ /api/ {
        limit_req zone=ch_api burst=20 nodelay;
        include /etc/nginx/snippets/cliphunter-php.conf;
    }

    # --- Finished files: only reachable through X-Accel-Redirect from PHP ---
    location ^~ /_files/ {
        internal;
        alias __APP__/shared/storage/downloads/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # --- Static assets (versioned with ?v=<git sha>) ---
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/cliphunter-headers.conf;
    }

    # Never expose the front controller, dotfiles or anything outside public/.
    location = /index.php { return 404; }
    location ~ /\.        { return 404; }
    location ~ \.php$     { return 404; }

    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/cliphunter-headers.conf;
    }
}
