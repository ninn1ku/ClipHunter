; ClipHunter PHP-FPM pool (1 GB RAM server: few, on-demand workers).
[cliphunter]
user = cliphunter
group = cliphunter

listen = /run/php/cliphunter.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

request_terminate_timeout = 75s
catch_workers_output = yes
decorate_workers_output = no

clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[HOME] = /var/www/cliphunter/shared/storage/cache
env[DENO_DIR] = /var/www/cliphunter/shared/storage/cache/deno

php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 70
php_admin_value[post_max_size] = 16K
php_admin_value[upload_max_filesize] = 0
php_admin_flag[file_uploads] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/www/cliphunter/shared/storage/logs/php-error.log
php_admin_flag[allow_url_fopen] = off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,pcntl_exec,dl
php_admin_value[open_basedir] = /var/www/cliphunter/:/usr/bin/:/tmp/
